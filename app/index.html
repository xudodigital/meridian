<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Meridian</title>
    <meta name="description" content="Control room for the AI agents that run your SEO sites, one per country, with human approval before anything publishes.">
    <meta name="application-name" content="Meridian">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fbf8ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#11131c" media="(prefers-color-scheme: dark)">
    <!-- A private dashboard: search engines must not index it. Link previews still work. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Meridian">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Link previews (Open Graph, X/Twitter). Paths are relative because Meridian runs on this computer only;
         set absolute URLs here if it is ever served from a public address. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Meridian">
    <meta property="og:title" content="Meridian: run every SEO agent from one control room">
    <meta property="og:description" content="One site per country. A person approves before anything publishes.">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Meridian: run every SEO agent from one control room.">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Meridian: run every SEO agent from one control room">
    <meta name="twitter:description" content="One site per country. A person approves before anything publishes.">
    <meta name="twitter:image" content="/og-image.png">
    <meta name="twitter:image:alt" content="Meridian: run every SEO agent from one control room.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
